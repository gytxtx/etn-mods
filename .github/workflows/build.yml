name: build

on:
  workflow_dispatch:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Godot 4.7-stable
        shell: pwsh
        run: |
          $ver = "4.7-stable"
          $url = "https://github.com/godotengine/godot/releases/download/$ver/Godot_v$ver" + "_win64.exe.zip"
          Write-Host "下载 $url"
          Invoke-WebRequest -Uri $url -OutFile godot.zip -TimeoutSec 600
          Expand-Archive godot.zip -DestinationPath godot
          Get-ChildItem -Recurse godot -Filter "*.exe" | Select-Object -ExpandProperty FullName

      - name: 准备 EasyTier 二进制
        shell: pwsh
        run: .\tools\fetch-easytier.ps1

      - name: 打包
        shell: pwsh
        run: |
          $godot = (Get-ChildItem -Recurse godot -Filter "*_console.exe" | Select-Object -First 1).FullName
          if (-not $godot) { $godot = (Get-ChildItem -Recurse godot -Filter "*.exe" | Select-Object -First 1).FullName }
          .\build.ps1 -Godot $godot

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: mods
          path: dist/*.zip
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
